name: Kotlin Android Build (APK)

on:
  push:
    branches:
    - main
  pull_request:  
    branches: 
    - main
  workflow_dispatch: # Allows manual trigger directly from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
    
      # 1. Setup Java for Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
    
      # 2. Grant execution permissions to Gradle wrapper (Crucial for CI)
      - name: Grant execute permission to gradlew
        run: chmod +x gradlew
        # working-directory: ./app # Assuming gradlew is accessible relative to app/
    
      # 3. Build the Debug APK using Gradle
      # We use 'assembleDebug' as it doesn't require complex signing keys, making it fast and reliable for CI.
      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: ./app # Assuming app/ contains the build.gradle and src/
    
      # 4. Upload the generated APK artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
