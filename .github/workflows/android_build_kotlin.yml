name: Kotlin Android Build (APK)

on:
  push:
    branches:
    - main
  pull_request:  
    branches: 
    - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
    
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Regenerate Gradle Wrapper with Docker
        run: docker run --rm -v $(pwd):/workspace -w /workspace gradle:8.2 gradle wrapper --gradle-version 8.2

      - name: Commit and push gradle wrapper
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git commit -m "Regenerate gradle wrapper" || echo "No changes to commit"
          git push origin main || echo "Nothing to push"

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug
    
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
