name: Kotlin Android Build (APK)

on:
  push:
    branches:
    - main
  pull_request:  
    branches: 
    - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
    
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Regenerate Gradle Wrapper with Docker
        run: docker run --rm -v $(pwd):/workspace -w /workspace gradle:8.2 gradle wrapper --gradle-version 8.2

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push Gradle Wrapper
        run: |
          if git diff --quiet gradle/wrapper/; then
            echo "No changes to gradle wrapper"
          else
            git add gradle/wrapper/
            git commit -m "Regenerate gradle wrapper jar [skip ci]"
            git push origin main
          fi

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug
    
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
